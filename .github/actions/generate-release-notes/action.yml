name: 'Generate release notes'
description: 'Builds a Markdown changelog grouped by Conventional Commits prefix from commits since the last tag.'

inputs:
  version:
    description: 'Version being released (no v prefix)'
    required: true
  last_tag:
    description: 'Previous tag to diff from (e.g. "v1.4.1"). Empty = include all history.'
    required: false
    default: ''
  app_name:
    description: 'Display name for the release notes header'
    required: true

outputs:
  notes_path:
    description: 'Path to the generated markdown file'
    value: ${{ steps.generate.outputs.notes_path }}

runs:
  using: composite
  steps:
    - name: Generate notes
      id: generate
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        LAST_TAG: ${{ inputs.last_tag }}
        APP_NAME: ${{ inputs.app_name }}
      run: |
        set -euo pipefail

        # On windows-latest, $RUNNER_TEMP is a Windows path (C:\...). Git Bash
        # mostly handles this, but converting to a Unix-style path avoids edge
        # cases when redirecting / sourcing.
        OUT_DIR="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
        OUT="$OUT_DIR/release-notes-${VERSION}.md"

        # Range to diff: from LAST_TAG (if any) to HEAD.
        if [ -n "$LAST_TAG" ]; then
          RANGE="${LAST_TAG}..HEAD"
          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${LAST_TAG}...v${VERSION}"
        else
          RANGE="HEAD"
          COMPARE_URL=""
        fi

        # Collect raw commits: hash<TAB>subject<TAB>author
        COMMITS=$(git log --no-merges --pretty=format:'%h%x09%s%x09%an' $RANGE 2>/dev/null || echo "")

        # Parse into category buckets.
        declare -A BUCKETS
        BUCKETS=( \
          ["feat"]="### ✨ Features" \
          ["fix"]="### 🐞 Fixes" \
          ["perf"]="### ⚡ Performance" \
          ["docs"]="### 📝 Docs" \
          ["refactor"]="### 🛠️ Refactor" \
          ["test"]="### ✅ Tests" \
          ["build"]="### 📦 Build" \
          ["ci"]="### 🤖 CI" \
          ["chore"]="### 🧹 Chore" \
          ["style"]="### 🎨 Style" \
          ["other"]="### Other" \
        )
        ORDER=(feat fix perf docs refactor test build ci chore style other)
        declare -A LINES
        for k in "${ORDER[@]}"; do LINES[$k]=""; done

        BREAKING_LINES=""

        while IFS=$'\t' read -r hash subject author; do
          [ -z "$hash" ] && continue
          line="- ${subject} ([\`${hash}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${hash})) — _@${author}_"

          # Match conventional-commit prefix.
          # Examples: "feat: x", "fix(scope): x", "feat!: x", "feat(api)!: x"
          if [[ "$subject" =~ ^([a-z]+)(\([^)]+\))?(!)?:[[:space:]] ]]; then
            type="${BASH_REMATCH[1]}"
            bang="${BASH_REMATCH[3]}"
            case "$type" in
              feat|fix|perf|docs|refactor|test|build|ci|chore|style) ;;
              *) type="other" ;;
            esac
            if [ "$bang" = "!" ]; then
              BREAKING_LINES+="$line"$'\n'
            fi
          else
            type="other"
          fi
          LINES[$type]+="$line"$'\n'
        done <<< "$COMMITS"

        # Write the output.
        {
          if [ -n "$BREAKING_LINES" ]; then
            echo "## 💥 Breaking changes"
            echo
            printf '%s' "$BREAKING_LINES"
            echo
          fi

          for k in "${ORDER[@]}"; do
            if [ -n "${LINES[$k]}" ]; then
              echo "${BUCKETS[$k]}"
              echo
              printf '%s' "${LINES[$k]}"
              echo
            fi
          done

          echo "---"
          echo
          if [ -n "$COMPARE_URL" ]; then
            echo "**Full diff:** $COMPARE_URL"
            echo
          fi
          echo "_Release notes auto-generated by [ReboundMan-ReleaseToolkit](https://github.com/ReboundMan/ReboundMan-ReleaseToolkit). Edit before publishing if needed._"
        } > "$OUT"

        echo "notes_path=$OUT" >> "$GITHUB_OUTPUT"
        echo "::group::Generated release notes"
        cat "$OUT"
        echo "::endgroup::"
